<title>Add Custom Expense • Finora</title></head><body data-page="custom-expense"><div id="app"><main class="main"><div class="container"><header class="topbar"><div class="title-wrap"><a class="back-link" href="expenses.html" aria-label="Back"><i data-icon="back"></i></a><h1>Add Custom Expense</h1></div></header><form id="data-form" class="card u-p-20"><div class="form-grid"><div class="field"><label>Category *</label><input name="category_name" required placeholder="Other Spend"></div><div class="field"><label>Subcategory</label><input name="subcategory" placeholder="Online Food"></div><div class="field"><label>Amount *</label><input name="amount" type="number" step="0.01" min="0.01" required></div><div class="field"><label>Date *</label><input name="expense_date" type="date" required></div><div class="field u-col-span"><label>Description</label><input name="description" placeholder="Enter description"></div><div class="field u-col-span"><label>Notes</label><textarea name="notes" placeholder="Enter notes"></textarea></div><div class="field u-col-span"><label>Upload Pictures (Optional)</label><label class="upload-box"><input type="file" accept="image/jpeg,image/png"><span><i data-icon="upload"></i><br><strong>Tap to upload pictures</strong><br><small>JPG, PNG up to 5MB</small></span></label></div><div class="field"><label>Payment Method</label><select name="payment_method"><option value="">Select Payment Method</option><option>UPI</option><option>Cash</option><option>Card</option><option>Bank Transfer</option></select></div></div><button class="primary-btn full u-mt-18" type="submit"><i data-icon="save"></i> Save Expense</button></form></div></main></div><script src="js/config.runtime.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0/dist/umd/supabase.min.js" integrity="sha384-1+ItoWbWcmVSm+Y+dJaUt4SEWNA21/jxef+Z0TSHHVy/dEUxEUEnZ1bHn6GT5hj+" crossorigin="anonymous"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/session.js"></script><script src="js/app.js"></script><script src="js/pwa.js"></script></body></html>
