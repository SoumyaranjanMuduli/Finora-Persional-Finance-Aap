<!doctype html><html lang="en"><head><meta charset="utf-8"><script src="js/theme.js"></script><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icons/favicon-32.png"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EEE7DD"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/expenses.css"><link rel="stylesheet" href="css/reports.css"><link rel="stylesheet" href="css/quick-add.css"><link rel="stylesheet" href="css/utilities.css"><link rel="stylesheet" href="css/install.css"><link rel="stylesheet" href="css/responsive.css">
<title>Quick Add • Finora</title></head><body data-page="quick-add"><div id="app"><main class="main"><div class="container">

<header class="topbar">
  <div class="title-wrap">
    <h1>Quick Add</h1>
    <p>Add a transaction or jump into any category</p>
  </div>
  <div class="actions">
    <a class="icon-btn quick-add-header-add" href="categories.html" aria-label="Add category"><i data-icon="plus"></i></a>
    <button id="quick-add-search-toggle" class="icon-btn" type="button" aria-label="Search categories"><i data-icon="search"></i></button>
  </div>
</header>

<div class="field u-hidden-mb18" id="quick-add-search-wrap">
  <input id="quick-add-search" type="search" placeholder="Search a category, e.g. Movie, Recharge…" aria-label="Search categories">
</div>

<section class="section-title quick-add-section">
  <h2>Quick Actions</h2>
</section>
<div class="quick-add-grid">
  <a class="quick-add-tile quick-add-action" href="add-income.html" data-search="income salary">
    <span class="quick-add-icon"><i data-icon="wallet"></i></span>
    <span>Income</span>
  </a>
  <a class="quick-add-tile quick-add-action" href="add-expense.html" data-search="expense add">
    <span class="quick-add-icon"><i data-icon="receipt"></i></span>
    <span>Expense</span>
  </a>
  <a class="quick-add-tile quick-add-action" href="grocery.html" data-search="grocery cart">
    <span class="quick-add-icon"><i data-icon="cart"></i></span>
    <span>Grocery</span>
  </a>
  <a class="quick-add-tile quick-add-action" href="rent.html" data-search="room rent house">
    <span class="quick-add-icon"><i data-icon="rent"></i></span>
    <span>Room Rent</span>
  </a>
  <a class="quick-add-tile quick-add-action" href="daily-details.html" data-search="daily details today">
    <span class="quick-add-icon"><i data-icon="check"></i></span>
    <span>Daily Details</span>
  </a>
  <a class="quick-add-tile quick-add-action" href="custom-expense.html" data-search="custom any expense">
    <span class="quick-add-icon"><i data-icon="plus"></i></span>
    <span>Custom Expense</span>
  </a>
</div>

<section class="section-title quick-add-section">
  <h2>Browse Categories</h2>
  <span class="muted u-fs-12">Tap to view expenses</span>
</section>
<div id="quick-add-categories">
  <div class="empty state-loading"><span class="state-spinner"></span><span>Loading…</span></div>
</div>
<div class="quick-add-empty" id="quick-add-no-results"><strong>No matches found</strong><span>Try a different search term.</span></div>

</div></main></div>

<script src="js/config.runtime.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0/dist/umd/supabase.min.js" integrity="sha384-1+ItoWbWcmVSm+Y+dJaUt4SEWNA21/jxef+Z0TSHHVy/dEUxEUEnZ1bHn6GT5hj+" crossorigin="anonymous"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/session.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
</body></html>
