<!doctype html><html lang="en"><head><meta charset="utf-8"><script src="js/theme.js"></script><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icons/favicon-32.png"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EEE7DD"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/utilities.css"><link rel="stylesheet" href="css/install.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/settings.css"><title>Settings • Finora</title></head><body data-page="settings"><div id="app"><main class="main"><div class="container"><header class="topbar"><div class="title-wrap"><a class="back-link" href="more.html" aria-label="Back"><i data-icon="back"></i></a><div><h1>Settings</h1><p>Personalize Finora and control reminders</p></div></div></header>
<section class="settings-section"><div class="section-title"><h2>Appearance</h2></div><div class="settings-grid"><button class="settings-card" type="button" data-theme-choice="light"><span class="settings-icon">☀</span><span><strong>Light</strong><small>Warm, bright interface</small></span><span class="settings-check" id="theme-light-check"></span></button><button class="settings-card" type="button" data-theme-choice="dark"><span class="settings-icon">☾</span><span><strong>Velvet Dark</strong><small>Dark interface for low light</small></span><span class="settings-check" id="theme-dark-check"></span></button></div></section>
<section class="settings-section"><div class="section-title"><h2>Regional</h2></div><form id="settings-regional" class="card settings-form"><div class="field"><label for="settings-currency">Currency</label><select id="settings-currency" name="currency"><option value="INR">₹ Indian Rupee (INR)</option><option value="USD">$ US Dollar (USD)</option><option value="EUR">€ Euro (EUR)</option><option value="GBP">£ British Pound (GBP)</option><option value="AUD">A$ Australian Dollar (AUD)</option><option value="CAD">C$ Canadian Dollar (CAD)</option><option value="SGD">S$ Singapore Dollar (SGD)</option><option value="AED">د.إ UAE Dirham (AED)</option></select></div><div class="field"><label for="settings-timezone">Time zone</label><select id="settings-timezone" name="timezone"></select></div><button class="primary-btn" type="submit"><i data-icon="save"></i> Save Regional Settings</button></form></section>
<section class="settings-section"><div class="section-title"><h2>Reminders</h2></div><form id="settings-notifications" class="card settings-form"><label class="setting-toggle"><span><strong>Daily expense reminder</strong><small>Remind me when today's expenses haven't been entered</small></span><input type="checkbox" name="daily_reminder_enabled"><span class="toggle-ui"></span></label><label class="setting-toggle"><span><strong>Salary notifications</strong><small>Allow salary-related reminders</small></span><input type="checkbox" name="salary_notifications_enabled"><span class="toggle-ui"></span></label><label class="setting-toggle"><span><strong>Budget notifications</strong><small>Allow budget-related reminders</small></span><input type="checkbox" name="budget_notifications_enabled"><span class="toggle-ui"></span></label><button class="primary-btn" type="submit"><i data-icon="save"></i> Save Reminder Settings</button></form></section>
<section class="settings-section"><div class="section-title"><h2>Account & Security</h2></div><div class="settings-grid"><a class="settings-card" href="profile.html"><span class="settings-icon">◉</span><span><strong>Profile & Security</strong><small>Password, phone and account deletion</small></span><i data-icon="arrow"></i></a><a class="settings-card" href="notifications.html"><span class="settings-icon">♢</span><span><strong>Notifications</strong><small>Review and clear finance alerts</small></span><i data-icon="arrow"></i></a></div></section>
<section class="settings-section"><div class="section-title"><h2>Data</h2></div><div class="settings-grid"><a class="settings-card" href="export.html"><span class="settings-icon">↓</span><span><strong>Export Data</strong><small>Download your financial records</small></span><i data-icon="arrow"></i></a><a class="settings-card" href="privacy.html"><span class="settings-icon">♙</span><span><strong>Privacy</strong><small>How Finora handles your data</small></span><i data-icon="arrow"></i></a></div></section>
</div></main></div><script src="js/config.runtime.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0/dist/umd/supabase.min.js" integrity="sha384-1+ItoWbWcmVSm+Y+dJaUt4SEWNA21/jxef+Z0TSHHVy/dEUxEUEnZ1bHn6GT5hj+" crossorigin="anonymous"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/session.js"></script><script src="js/app.js"></script><script src="js/pwa.js"></script></body></html>
